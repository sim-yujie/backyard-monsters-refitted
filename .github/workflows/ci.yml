# The checks every push and pull request to revamp or main must pass: the web
# client's typecheck, lint and tests, the combat-rules copies being in sync,
# and the server's typecheck and tests, the database tests included (audit
# 2026-10-29: agent-handoffs/reports/audit-metrics-2026-10-29.md, fix #1),
# and the layout check: every window in WebKit at phone, iPad and desktop
# sizes (the `layout` job at the end).
#
# Every step is a command that runs the same way on a developer's machine.
#
# Server: the `*.db.test.ts` suites skip themselves unless their *_TEST_DB
# variable names a throwaway database. Here Postgres and Redis run as
# services, the database is built the way `bun run db:init` builds a new one
# (schema:create, then the migrations), and every *_TEST_DB points at it, so
# they run.
name: CI

on:
  push:
    branches: [revamp, main]
  pull_request:
    branches: [revamp, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: bun install --frozen-lockfile
      # Some web tests import server code (e.g. yard error rules), which needs
      # the server's packages too.
      - name: Install server packages
        working-directory: server
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npx vitest run
      - name: Combat-rules copies in the server match the web originals
        run: node tools/sync-combat-rules.mjs --check

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: bym_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.10.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ci-only
      DB_NAME: bym_ci
      REDIS_URL: redis://localhost:6379/1
      # Test-only; the server refuses to start without one (StartupSafety.ts).
      SECRET_KEY: ci-only-test-key
      # The opt-in database suites (see the top of this file).
      BOTS_TEST_DB: bym_ci
      BUG_REPORT_TEST_DB: bym_ci
      DASHBOARD_TEST_DB: bym_ci
      DEFENCES_TEST_DB: bym_ci
      EVENTS_TEST_DB: bym_ci
      FRIENDS_TEST_DB: bym_ci
      HEALTH_TEST_DB: bym_ci
      INFERNO_TEST_DB: bym_ci
      NEIGHBOURS_TEST_DB: bym_ci
      NOTICES_TEST_DB: bym_ci
      NOTIF_TEST_DB: bym_ci
      PRIVACY_TEST_DB: bym_ci
      BOTS_TEST_REDIS: redis://localhost:6379/1
      HEALTH_TEST_REDIS: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Build the test database (as db:init does)
        env:
          # Quiets the ORM's query log (mikro-orm.config.ts).
          ENV: prod
        run: |
          bun --bun x mikro-orm schema:create -r
          bun --bun x mikro-orm migration:up
      - name: Tests
        run: bun test

  # The layout check (web/e2e/layout, owner 15 Nov 2026): every window opened
  # in Safari's engine (Playwright WebKit) on phone, iPad and desktop sizes,
  # failing when a window sticks out of the screen, its close button or tabs
  # are cut off, or its list is empty or squashed. It starts its own game
  # server (QUIET_LOGIN, DEV_SANDBOX) and a built web page against a database
  # built as the server job builds it; every run uploads the report, with a
  # picture of each broken window. Rules: .claude/skills/layout-rules.
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: bym_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.10.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ci-only
      DB_NAME: bym_ci
      SECRET_KEY: ci-only-test-key
      LAYOUT_DB_NAME: bym_ci
      LAYOUT_REDIS_URL: redis://localhost:6379/1
      # The game server's log in the job's output, for a sign-in or boot failure.
      LAYOUT_SERVER_LOG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install server packages
        working-directory: server
        run: bun install --frozen-lockfile
      - name: Install web packages
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build the test database (as db:init does)
        working-directory: server
        env:
          ENV: prod
        run: |
          bun --bun x mikro-orm schema:create -r
          bun --bun x mikro-orm migration:up
      - name: Install WebKit
        working-directory: web
        run: npx playwright install --with-deps webkit
      - name: Layout check (WebKit)
        working-directory: web
        run: npm run test:layout
      - name: Upload the layout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-report
          path: |
            web/e2e/layout/report
            web/e2e/layout/results
          retention-days: 14
          if-no-files-found: ignore
