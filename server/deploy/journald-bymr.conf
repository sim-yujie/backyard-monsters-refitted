# Keeps the server's console logs for at most 30 days (docs/deploy.md, step 7).
#
# docker-compose.prod.yml sends what every container prints (the game
# server, Caddy, the database, the backup helper) to journald, the system's
# own log store. Those lines include players' IP addresses (logins, saves),
# so they must not be kept forever.
#
# Install on the VPS, once:
#   mkdir -p /etc/systemd/journald.conf.d
#   cp deploy/journald-bymr.conf /etc/systemd/journald.conf.d/bymr.conf
#   systemctl restart systemd-journald
#
# journald deletes whole files, so it starts a new one every day
# (MaxFileSec) and deletes files whose newest line is older than 29 days
# (MaxRetentionSec): nothing is ever more than 30 days old. SystemMaxUse caps
# the space all logs may take.
[Journal]
Storage=persistent
MaxFileSec=1day
MaxRetentionSec=29day
SystemMaxUse=2G
