<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <!-- The owner's dashboard (src/admin/). Linked from nowhere a player sees;
         the page shows only "Not found" to anyone but the owner. The title
         stays plain until the server says who is looking. -->
    <title>Backyard Monsters Revamped</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      /* Until the page's own styles load: the same ground, light or dark. */
      html,
      body {
        margin: 0;
        background: #f3f5f8;
        color: #1b2230;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #111620;
          color: #eef1f5;
        }
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/admin/index.ts"></script>
  </body>
