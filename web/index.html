<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Backyard Monsters Revamped</title>
    <meta name="description" content="Backyard Monsters Revamped, a fan-made revamp of Backyard Monsters you play in the browser." />

    <!-- Inline so there is no extra request and no 404 before art exists. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M10 3h12l6 13-6 13H10L4 16z' fill='%23f0a12e'/%3E%3C/svg%3E"
    />

    <!-- Everywhere, headings to numbers: Titan One (#223), the free SIL Open
         Font License 1.1 look-alike of Flash's Grobold; see README. Bundled
         under public/fonts/titan-one/ and declared in tokens.css, so this is
         a same-origin file and never a request to Google's servers. -->
  </head>
  <body>
    <!-- The Pixi canvas is appended here by App; the HTML overlay sits above it. -->
    <div id="game-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
